[project]
name = "vae-latent-risk-factor"
version = "0.1.0"
description = "VAE-based latent risk factor discovery for portfolio construction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "ecos",
    "mosek",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "fredapi>=0.5",
    "tensorboard>=2.14",
    "tqdm>=4.60",          # training / inference progress bars
    "matplotlib>=3.7",     # diagnostic plots (src/integration)
    "pyarrow>=14",         # parquet I/O (Tiingo data, SP500 cache)
    "pyyaml>=6.0",         # run_walk_forward.py --config *.yaml
    "requests>=2.28",      # scripts/download_tiingo.py
    "yfinance>=0.2",       # SP500 benchmark (auto-download if cache missing)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright",
    "pylint",
    "flake8",
]
notebook = [
    "ipython>=8.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
